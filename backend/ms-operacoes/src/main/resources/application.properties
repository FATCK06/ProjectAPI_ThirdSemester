spring.application.name=ms-operacoes
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=8083
# So loopback: evita o prompt de firewall do Windows a cada porta nova.
# Em ambiente de rede, sobrescreva com SERVER_ADDRESS=0.0.0.0
server.address=${SERVER_ADDRESS:127.0.0.1}

# Dono de motoristas, veiculos e agregados.
frota.base-url=${FROTA_BASE_URL:http://localhost:8082}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Supabase (PostgreSQL). Preencha via variaveis de ambiente locais, nunca em texto neste arquivo.
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USER:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Quem cria schema e o Flyway. "update" criou tabelas duplicadas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Ver db/README.md antes de ligar: o baseline depende do que ja foi aplicado na mao.
spring.flyway.enabled=false

# viagens.id_viagem e IDENTITY, entao o Hibernate NAO agrupa os inserts (precisa da
# chave de volta a cada um). Estas opcoes ficam prontas para quando a PK virar
# sequence; hoje nao tem efeito na importacao.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true