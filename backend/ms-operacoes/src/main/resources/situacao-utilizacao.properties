# Cortes da faixa de utilizacao do motorista (%), aplicados na consulta da
# situacao (SituacaoMotoristaService.listar), sobre os dias gravados em
# controle_disponibilidade:
#   ALTA           utilizacao >= 80         -> INDISPONIVEL
#   INTERMEDIARIA  50 <= utilizacao < 80    -> DISPONIVEL
#   BAIXA          utilizacao < 50          -> DISPONIVEL
# Exatamente 80 e ALTA; exatamente 50 e INTERMEDIARIA.
#
# Faixa e situacao nao sao gravadas: para trocar os cortes basta reiniciar o
# ms-operacoes, sem reimportar. Variavel de ambiente sobrescreve este arquivo
# (SITUACAO_UTILIZACAO_CORTEBAIXA, SITUACAO_UTILIZACAO_CORTEALTA).
situacao.utilizacao.corte-baixa=50
situacao.utilizacao.corte-alta=80
