spring.datasource.url=jdbc:h2:mem:ms-veiculos-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Este arquivo substitui o application.properties principal nos testes, entao as
# propriedades sem valor padrao precisam ser repetidas aqui. Nenhuma chamada ao
# ms-frota acontece na subida do contexto.
frota.base-url=http://localhost:8082
situacao.utilizacao.corte-baixa=40
situacao.utilizacao.corte-alta=70
