spring.application.name=ms-frota
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=8082
# So loopback: evita o prompt de firewall do Windows a cada porta nova.
# Em ambiente de rede, sobrescreva com SERVER_ADDRESS=0.0.0.0
server.address=${SERVER_ADDRESS:127.0.0.1}

# Supabase (PostgreSQL). Preencha via variaveis de ambiente locais, nunca em texto neste arquivo.
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USER:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Quem cria schema e o Flyway (db/migration na raiz do projeto).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enquanto o banco e compartilhado, so um servico roda as migrations.
spring.flyway.enabled=false

# Upsert de motoristas e agregados vem em lote na importacao de manifestos.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
