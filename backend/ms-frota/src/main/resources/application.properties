spring.application.name=ms-frota
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=8082

# Credenciais do banco e chave do JWT vem de backend/.env (copia do .env.example,
# fora do git). Variavel de ambiente definida no sistema tem prioridade sobre o arquivo.
spring.config.import=optional:file:../.env[.properties]

# Supabase (PostgreSQL). Os valores vem do .env, nunca em texto neste arquivo.
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USER:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# O pooler do Supabase limita as conexoes, e os quatro servicos dividem o mesmo banco.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=60000

# Quem cria schema e o Flyway (db/migration na raiz do projeto).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enquanto o banco e compartilhado, so um servico roda as migrations.
spring.flyway.enabled=false

# Upsert de motoristas e agregados vem em lote na importacao de manifestos.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# Só o health fica exposto. Os demais endpoints do Actuator (env, beans, mappings)
# revelam configuracao e nao devem ficar acessiveis.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
