spring.application.name=ms-usuarios
server.port=8081
# Escuta so na propria maquina: o navegador fala apenas com o gateway (8080).
# Aberto na rede, daria para pular o gateway e forjar o header X-User-Role.
# Em container, SERVER_ADDRESS=0.0.0.0 e a porta NAO e publicada.
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Credenciais do banco e chave do JWT vem de backend/.env (copia do .env.example,
# fora do git). Variavel de ambiente definida no sistema tem prioridade sobre o arquivo.
spring.config.import=optional:file:../.env[.properties]

# Supabase (PostgreSQL). Os valores vem do .env, nunca em texto neste arquivo.
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USER:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# O pooler do Supabase limita as conexoes, e os quatro servicos dividem o mesmo banco.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=60000

# Quem cria schema e o Flyway (db/migration na raiz do projeto).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Assina o token do login. A mesma chave e conferida no api-gateway.
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:}

# Primeiro Administrador, criado na subida se ainda nao existir nenhum
# (ver AdministradorInicial). Vazio = nao cria. Os valores vem do .env.
app.admin-inicial.email=${ADMIN_INICIAL_EMAIL:}
app.admin-inicial.senha=${ADMIN_INICIAL_SENHA:}

# Só o health fica exposto. Os demais endpoints do Actuator (env, beans, mappings)
# revelam configuracao e nao devem ficar acessiveis.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Erro que escapa do ErroHandlerGlobal (ex.: falha num filtro) cai no /error do
# Spring. Estes ja sao os padroes; ficam explicitos para ninguem ligar sem querer.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
